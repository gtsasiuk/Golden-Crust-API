syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Orders.Contracts";
package orders;

service OrdersService {
  rpc GetOrder (GetOrderRequest) returns (OrderReply);
}

message GetOrderRequest { int64 id = 1; }

message Money {
  int64 units = 1;
  int32 nanos = 2;
}

message OrderItemReply {
  int64 menu_item_id = 1;
  string product_name = 2;
  Money unit_price = 3;
  int32 quantity = 4;
  Money line_total = 5;
}

message OrderReply {
  int64 id = 1;
  int64 customer_id = 2;
  string status = 3;
  optional string payment_status = 4;
  Money total_amount = 5;
  google.protobuf.Timestamp order_date = 6;
  string delivery_address = 7;
  repeated OrderItemReply items = 8;
}
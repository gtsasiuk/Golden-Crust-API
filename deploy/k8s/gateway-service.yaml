apiVersion: v1
kind: Service
metadata:
  name: gateway                     # DNS-ім'я: http://gateway
spec:
  type: ClusterIP              # доступний лише всередині кластера
  selector:
    app: gateway
  ports:
  - port: 80                   # порт сервісу
    targetPort: 8080           # порт контейнера

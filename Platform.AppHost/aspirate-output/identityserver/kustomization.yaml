resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: identityserver-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080;8000
    - IDENTITYSERVERDB_HOST=sql
    - IDENTITYSERVERDB_PORT=14330
    - IDENTITYSERVERDB_USERNAME=sa
    - IDENTITYSERVERDB_PASSWORD=Sql_Pass123x
    - IDENTITYSERVERDB_URI=mssql://sa:Sql_Pass123x@sql:14330/GoldenCrust_IdentityServer
    - IDENTITYSERVERDB_JDBCCONNECTIONSTRING=jdbc:sqlserver://sql:14330;databaseName=GoldenCrust_IdentityServer;trustServerCertificate=true
    - IDENTITYSERVERDB_DATABASENAME=GoldenCrust_IdentityServer
    - Clients__AggregatorSecret=aggregator-client-secret
    - SeedAdmin__UserName=admin
    - SeedAdmin__Email=admin@email.com
    - SeedAdmin__Password=admin123
    - SeedUser__UserName=testuser
    - SeedUser__Email=user@email.com
    - SeedUser__Password=user123
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    - OTEL_SERVICE_NAME=identityserver
    - ASPNETCORE_URLS=http://+:8080;

secretGenerator:
- name: identityserver-secrets
  envs:
  - .identityserver.secrets
